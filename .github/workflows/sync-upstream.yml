name: Sync official upstream

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-official-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout custom repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch official upstream
        run: |
          git remote add upstream https://github.com/Wei-Shaw/sub2api.git
          git fetch --no-tags upstream main

      - name: Apply official changes without replacing custom workflows
        id: sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="sync/upstream-${GITHUB_RUN_ID}"
          upstream_sha="$(git rev-parse upstream/main)"
          previous_sha="$(cat .upstream-ref 2>/dev/null || true)"

          if [[ -z "$previous_sha" ]] || ! git fetch --no-tags upstream "$previous_sha"; then
            echo "缺少有效的 .upstream-ref 或官方基线无法读取，停止同步。" >&2
            exit 1
          fi
          if [[ "$previous_sha" == "$upstream_sha" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "官方没有新的可合并内容。"
            exit 0
          fi

          git switch -c "$branch"
          git diff --binary "$previous_sha" "$upstream_sha" -- . ':(exclude).github/workflows/**' > "$RUNNER_TEMP/upstream.patch"
          if [[ -s "$RUNNER_TEMP/upstream.patch" ]] && ! git apply --3way --whitespace=nowarn "$RUNNER_TEMP/upstream.patch"; then
            echo "官方改动与定制代码存在冲突；main 未修改。" >&2
            exit 1
          fi
          printf '%s\n' "$upstream_sha" > .upstream-ref
          git add -A
          if git diff --cached --quiet HEAD --; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有新的官方代码变更。"
            exit 0
          fi
          git commit -m "chore: sync official upstream"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.sync.outputs.changed == 'true'
        run: git push --set-upstream origin "${{ steps.sync.outputs.branch }}"

      - name: Open review pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${{ steps.sync.outputs.branch }}" \
            --title "chore: sync official upstream" \
            --body "官方提交增量已移植到临时分支。请检查差异并等待 CI 通过后再合并；冲突时 main 保持不变。"
