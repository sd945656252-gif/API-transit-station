name: Check official stable release

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Report the latest official stable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/Wei-Shaw/sub2api/releases/latest --jq '"Official stable release: " + .tag_name + "\n" + .html_url' >> "$GITHUB_STEP_SUMMARY"
          printf '\nInstalled official baseline: `%s`\n\nUse the administrator update button to merge, build, publish and deploy. This scheduled check never changes source or running containers.\n' "$(cat .upstream-ref)" >> "$GITHUB_STEP_SUMMARY"
